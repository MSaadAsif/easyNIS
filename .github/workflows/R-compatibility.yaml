name: R-compatibility

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Ubuntu (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ['devel', 'oldrel-1']
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: ${{ matrix.r != 'devel' }}
          cran: ${{ matrix.r == 'devel' && 'https://cran.r-universe.dev' || '' }}
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Select R-universe binaries
        if: matrix.r == 'devel'
        run: |
          . /etc/os-release
          echo "PKG_CURRENT_PLATFORM=x86_64-pc-linux-gnu-ubuntu-${VERSION_ID}-linux.binary.${VERSION_CODENAME}-x86_64" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          install-quarto: false
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
