name: DuckDB proofs

on:
  pull_request:
    paths:
      - .github/workflows/duckdb-proofs.yaml
      - tools/formal/duckdb/**
      - .agents/skills/duckdb-sql-equivalence/**
      - .claude/skills/duckdb-sql-equivalence/**
      - DESCRIPTION
      - R/**
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/formal/duckdb
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the pinned Lean toolchain
        run: |
          installer=https://raw.githubusercontent.com/leanprover/elan/v4.4.0/elan-init.sh
          curl --fail --silent --show-error --location "$installer" --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build DuckDB proofs
        run: |
          lean --version
          time lake build
