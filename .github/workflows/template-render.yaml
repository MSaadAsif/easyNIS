name: template-render

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/template-render.yaml'
              - '.agents/skills/verify/**'
              - '.Rbuildignore'
              - 'DESCRIPTION'
              - 'NAMESPACE'
              - 'R/**'
              - 'data/**'
              - 'inst/**'
              - 'src/**'
              - 'tools/probe/workspace.R'

  template-render:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::xml2
          needs: check
      - name: Create and render a synthetic study
        run: Rscript --vanilla .agents/skills/verify/drive.R study-ci
      - name: Verify rare-cohort disclosure in the report
        run: Rscript --vanilla .agents/skills/verify/drive.R study-small
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-study-render
          path: |
            local/loop/verification/*-study-ci-*/
            local/loop/verification/*-study-small-*/
          retention-days: 14
