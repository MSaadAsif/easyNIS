name: template-render

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::xml2
          needs: check
      - name: Create and render a synthetic study
        run: Rscript --vanilla .agents/skills/verify/drive.R study-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-study-render
          path: local/loop/verification/*-study-ci-*/
          retention-days: 14
