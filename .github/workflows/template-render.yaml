name: template-render

on:
  push:
    branches: [main]
    paths: &study-inputs
      - '.github/workflows/template-render.yaml'
      - '.agents/skills/verify/**'
      - '.Rbuildignore'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'R/**'
      - 'data/**'
      - 'inst/**'
      - 'src/**'
      - 'tools/probe/workspace.R'
  pull_request:
    paths: *study-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::xml2
          needs: check
      - name: Create and render a synthetic study
        run: Rscript --vanilla .agents/skills/verify/drive.R study-ci
      - name: Verify rare-cohort disclosure in the report
        run: Rscript --vanilla .agents/skills/verify/drive.R study-small
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-study-render
          path: |
            local/loop/verification/*-study-ci-*/
            local/loop/verification/*-study-small-*/
          retention-days: 14
