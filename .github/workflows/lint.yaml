name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::cyclocomp, any::lintr, any::jsonlite, local::.
          needs: check
      - name: Check improvement-loop tooling
        run: |
          for (script in c("tools/check-public-text.R", "tools/probe/test-probe-helpers.R")) {
            args <- if (grepl("check-public-text", script)) c(script, "--self-test") else script
            status <- system2("Rscript", args)
            if (status != 0L) quit(status = status)
          }
        shell: Rscript {0}
      - name: Lint package
        run: |
          lints <- lintr::lint_package()
          if (length(lints) > 0L) {
            print(lints)
            quit(status = 1L)
          }
        shell: Rscript {0}
