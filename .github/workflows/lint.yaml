name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: posit-dev/setup-air@v1
        with:
          version: '0.13.0'
      - uses: etiennebacher/setup-jarl@v0.1.1
        with:
          version: '0.7.1'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::callr, any::cyclocomp, any::jsonlite, any::goodpractice, any::pkgload
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: false
      - name: Check package lint
        run: Rscript --vanilla tools/check-package.R --lint
      - name: Check improvement-loop tooling
        run: |
          Rscript tools/check-public-text.R --self-test
          Rscript tools/probe/test-probe-helpers.R
          Rscript tools/probe/test-provenance.R
          Rscript tools/probe/test-readiness-ci.R
          Rscript tools/probe/test-privacy-guard.R
      - name: Gate restricted CCSR query performance
        timeout-minutes: 2
        run: |
          evidence="$RUNNER_TEMP/ccsr-gate"
          mkdir -p "$evidence"
          Rscript --vanilla tools/experiments/adr-0002/capture.R "$evidence" ccsr-fixture 2
          Rscript --vanilla tools/experiments/adr-0002/ccsr-gate.R "$evidence"
      - name: Gate procedure-day query performance
        timeout-minutes: 2
        run: |
          evidence="$RUNNER_TEMP/prday-gate"
          mkdir -p "$evidence"
          Rscript --vanilla tools/experiments/adr-0002/capture.R "$evidence" prday-fixture 2
          Rscript --vanilla tools/experiments/adr-0002/prday-gate.R "$evidence"
      - name: Gate design, annual totals, and cohort export performance
        timeout-minutes: 2
        run: Rscript --vanilla tools/experiments/adr-0002/design-gate.R "$RUNNER_TEMP/prday-gate"
