name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: posit-dev/setup-air@v1
        with:
          version: '0.13.0'
      - name: Check Air formatting
        run: air format . --check
      - uses: etiennebacher/setup-jarl@v0.1.1
        with:
          version: '0.7.1'
      - name: Check Jarl lint
        run: jarl check .
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::callr, any::cyclocomp, any::jsonlite, any::goodpractice, any::pkgload
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: false
      - name: Check improvement-loop tooling
        run: |
          Rscript tools/check-public-text.R --self-test
          Rscript tools/probe/test-probe-helpers.R
          Rscript tools/probe/test-provenance.R
          Rscript tools/probe/test-readiness-ci.R
          Rscript tools/probe/test-privacy-guard.R
          Rscript tools/probe/update-codemeta.R --check
      - name: Check installed package complexity
        run: Rscript --vanilla tools/check-package.R --complexity
