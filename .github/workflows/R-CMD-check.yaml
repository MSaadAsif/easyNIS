name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - name: Skip optional Ubuntu system packages
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99-easynis-ci
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck${{ runner.os == 'Linux' && ', any::roxygen2@8.1.1' || '' }}
          needs: check
          # The .qmd is a study template exercised by template-render.
          install-quarto: false
      - name: Verify generated documentation
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          roxygen2::roxygenise()
          if (system('git diff --exit-code -- NAMESPACE man DESCRIPTION') != 0) {
            stop('Generated documentation is out of date.')
          }
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'

  # Keep the required check names visible on PRs when compatibility jobs are skipped.
  # Use the Ubuntu release that matches the R-universe Linux binaries.
  R-devel:
    name: ubuntu-latest (R devel)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    env:
      R_KEEP_PKG_SOURCE: yes
      EASYNIS_FULL_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: false
          cran: https://cran.r-universe.dev
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Select R-universe binaries
        run: |
          . /etc/os-release
          echo "PKG_CURRENT_PLATFORM=x86_64-pc-linux-gnu-ubuntu-${VERSION_ID}-linux.binary.${VERSION_CODENAME}-x86_64" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          install-quarto: false
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'

  R-oldrel-1:
    name: ubuntu-latest (R oldrel-1)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    env:
      R_KEEP_PKG_SOURCE: yes
      EASYNIS_FULL_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: oldrel-1
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          install-quarto: false
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
