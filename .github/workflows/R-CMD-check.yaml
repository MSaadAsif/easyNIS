name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel'}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, roxygen2@8.1.0
          needs: check
      - name: Verify generated documentation
        run: |
          roxygen2::roxygenise()
          if (system('git diff --exit-code -- NAMESPACE man DESCRIPTION') != 0) {
            stop('Generated documentation is out of date.')
          }
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
      - name: Inspect source tarball
        run: |
          tarballs <- list.files('check', pattern = '[.]tar[.]gz$', full.names = TRUE)
          if (length(tarballs) != 1L) stop('Expected one checked source tarball.')
          status <- system2(file.path(R.home('bin'), 'Rscript'),
                            c('tools/check-tarball.R', shQuote(tarballs)))
          if (status != 0L) stop('Source tarball inspection failed.')
        shell: Rscript {0}
