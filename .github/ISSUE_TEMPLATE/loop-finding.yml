name: Improvement-loop finding
description: Report a reproducible problem found by the improvement loop.
title: ""
labels: [loop-found]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user-visible problem without real NIS values or private paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Reproduce with nis_example() or an invented synthetic fixture.
      render: r
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed fix
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Contains no real NIS numbers or records
          required: true
