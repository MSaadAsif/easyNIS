name: Question
description: Ask about using easyNIS.
title: "Question: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: Do not include licensed HCUP inputs, record-level data, private paths, or record-derived output.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Include a small example using invented or package example data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: easyNIS and R versions
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no licensed inputs, record-level data, private paths, local validation receipts, or record-derived output.
          required: true
