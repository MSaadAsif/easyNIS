url: https://msaadasif.github.io/easyNIS/
destination: _site
template:
  bootstrap: 5
  light-switch: true
  theme: github-light
  theme-dark: github-dark
  bslib:
    primary: "#176358"
    navbar-light-bg: "#edf6f3"
    navbar-dark-bg: "#172b2a"
    link-color-dark: "#8ed8c7"
    font-size-base: 1rem

home:
  links:
    - text: Get started
      href: articles/getting-started.html
    - text: Output gallery
      href: articles/gallery.html
    - text: Function reference
      href: reference/index.html

navbar:
  structure:
    left: [get_started, gallery, guides, concepts, reference, news]
    right: [search, github, lightswitch]
  components:
    get_started:
      text: Get started
      href: articles/getting-started.html
    gallery:
      text: Gallery
      href: articles/gallery.html
    guides:
      text: Guides
      menu:
        - text: Prepare annual NIS files
          href: articles/prepare-data.html
        - text: Define and save a cohort
          href: articles/cohorts.html
        - text: Derive outcomes, comorbidities, and costs
          href: articles/outcomes-and-costs.html
        - text: Make tables and fit survey models
          href: articles/tables-and-models.html
        - text: Analyze the whole sample in DuckDB
          href: articles/whole-sample.html
        - text: Estimate trends across NIS years
          href: articles/trends.html
        - text: Check disclosure before sharing results
          href: articles/disclosure.html
        - text: Start a Quarto study
          href: articles/study-template.html
        - text: Port a discharge analysis to easyNIS
          href: articles/porting.html
    concepts:
      text: Concepts
      menu:
        - text: How easyNIS works
          href: articles/how-easynis-works.html
        - text: How the NIS survey design works
          href: articles/nis-design.html
        - text: Years and coding eras
          href: articles/years-and-eras.html
        - text: Glossary
          href: articles/glossary.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/MSaadAsif/easyNIS
      aria-label: GitHub

articles:
  - title: Get started
    contents:
      - getting-started
      - articles/gallery
  - title: Guides
    desc: '<span id="guides"></span>'
    contents:
      - articles/prepare-data
      - articles/cohorts
      - articles/outcomes-and-costs
      - articles/tables-and-models
      - articles/whole-sample
      - articles/trends
      - articles/disclosure
      - articles/study-template
      - porting
  - title: Concepts
    desc: '<span id="concepts"></span>'
    contents:
      - articles/how-easynis-works
      - articles/nis-design
      - articles/years-and-eras
      - articles/glossary

reference:
  - title: Convert, open, and join
    desc: Prepare annual files, open them in DuckDB, and select or label analysis fields.
    contents:
      - nis_convert
      - nis_open
      - nis_join_companion
      - nis_example
      - nis_label
      - nis_vars_design
  - title: Define and save cohorts
    desc: Match clinical codes, count eligibility steps, and save a reusable cohort.
    contents:
      - nis_flag_dx
      - nis_flag_pr
      - nis_flag_pr_timing
      - nis_add_ccsr
      - nis_ccsr_codes
      - nis_attrition
      - nis_write_cohort
  - title: Audit coding and completeness
    desc: Compare code frequencies, diagnosis positions, and procedure-day coverage.
    contents:
      - nis_audit_code_transition
      - nis_audit_dx_position
      - nis_audit_prday
  - title: Derive outcomes, comorbidities, and costs
    desc: Add discharge outcomes, score comorbidities, and express costs in a common dollar year.
    contents:
      - nis_outcomes
      - nis_comorbidity
      - nis_comorbidity_condition_map
      - nis_cost
      - nis_cost_provenance
  - title: Estimate with the survey design
    desc: Build cohort or whole-sample designs, estimate annual totals, and report the fitted sample.
    contents:
      - nis_design
      - nis_survey
      - nis_annual_totals
      - nis_reweight
      - nis_design_report
  - title: Check disclosure
    desc: Count supporting discharges and hospitals, mask small cells, and scan publication files.
    contents:
      - nis_cell_counts
      - nis_suppress
      - nis_scan_outputs
  - title: Start a reproducible study
    desc: Create a Quarto project with a sample analysis and a disclosure checklist.
    contents:
      - nis_new_study

redirects:
  - [articles/opening-data.html, articles/prepare-data.html]
  - [articles/outcomes.html, articles/outcomes-and-costs.html]
  - [articles/comorbidity.html, articles/outcomes-and-costs.html]
  - [articles/costs.html, articles/outcomes-and-costs.html]
  - [articles/survey-design.html, articles/nis-design.html]
  - [articles/design-validation.html, articles/nis-design.html]
  - [articles/descriptives-models.html, articles/tables-and-models.html]
  - [articles/year-notes.html, articles/years-and-eras.html]
  - [articles/code-transitions.html, articles/years-and-eras.html]
  - [articles/why-easynis.html, articles/how-easynis-works.html]
