url: https://msaadasif.github.io/easyNIS/
destination: _site
template:
  bootstrap: 5

navbar:
  structure:
    left: [get_started, reference, articles, news]
    right: [github]
  components:
    get_started:
      text: Get started
      href: articles/getting-started.html
    github:
      icon: fa-github
      href: https://github.com/MSaadAsif/easyNIS
      aria-label: GitHub

articles:
  - title: Get started
    navbar: Articles
    contents:
      - getting-started
  - title: Guides
    desc: '<span id="guides"></span>'
    navbar: Articles
    contents:
      - articles/prepare-data
      - articles/cohorts
      - articles/outcomes-and-costs
      - articles/tables-and-models
      - articles/whole-sample
      - articles/trends
      - articles/disclosure
      - articles/study-template
      - porting
  - title: Concepts
    desc: '<span id="concepts"></span>'
    navbar: Articles
    contents:
      - articles/how-easynis-works
      - articles/nis-design
      - articles/years-and-eras
      - articles/glossary

reference:
  - title: 1. Open and inspect data
    desc: Open annual NIS files and inspect data structure and labels.
    contents:
      - nis_example
      - nis_write_cohort
      - nis_convert
      - nis_open
      - nis_join_companion
      - nis_label
      - nis_vars_design
  - title: 2. Define cohorts
    desc: Flag codes, timing, and eligibility; audit cohort definitions.
    contents:
      - nis_flag_dx
      - nis_flag_pr
      - nis_flag_pr_timing
      - nis_audit_prday
      - nis_add_ccsr
      - nis_ccsr_codes
      - nis_attrition
      - nis_audit_dx_position
      - nis_audit_code_transition
  - title: 3. Design and estimate
    desc: Build survey designs and apply optional reweighting.
    contents:
      - nis_design
      - nis_design_report
      - nis_survey
      - nis_reweight
      - nis_annual_totals
  - title: 4. Add analysis variables
    desc: Derive discharge outcomes, comorbidity indicators, and inflation-adjusted costs.
    contents:
      - nis_outcomes
      - nis_comorbidity
      - nis_cost
      - nis_cost_provenance
  - title: 5. Review outputs
    desc: Count supporting hospitals and suppress disclosure-prone cells.
    contents:
      - nis_cell_counts
      - nis_suppress
  - title: 6. Create a study skeleton
    desc: Create a Quarto project with a starter analysis file. Add your data and study-specific definitions and analysis.
    contents:
      - nis_new_study

redirects:
  - [articles/opening-data.html, articles/prepare-data.html]
  - [articles/outcomes.html, articles/outcomes-and-costs.html]
  - [articles/comorbidity.html, articles/outcomes-and-costs.html]
  - [articles/costs.html, articles/outcomes-and-costs.html]
  - [articles/survey-design.html, articles/nis-design.html]
  - [articles/design-validation.html, articles/nis-design.html]
  - [articles/descriptives-models.html, articles/tables-and-models.html]
  - [articles/year-notes.html, articles/years-and-eras.html]
  - [articles/code-transitions.html, articles/years-and-eras.html]
  - [articles/why-easynis.html, articles/how-easynis-works.html]
